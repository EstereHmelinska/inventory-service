plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
}

repositories {
    mavenCentral()
}

dependencies {

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka:4.0.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-test
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.0.0'

    // Source: https://mvnrepository.com/artifact/tools.jackson.core/jackson-databind
    implementation 'tools.jackson.core:jackson-databind:3.0.2'
}

test {
    useJUnitPlatform()
}